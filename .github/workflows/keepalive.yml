name: Maintien en activité

# GitHub suspend les tâches programmées d'un dépôt sans modification depuis 60 jours.
# Ce petit commit mensuel (fichier .github/keepalive.txt) évite cette mise en veille. Aucun effet sur l'application.
on:
  schedule:
    - cron: '17 6 1 * *'   # le 1er de chaque mois, 8 h 17 heure de Paris (6 h 17 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit mensuel
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "Maintien en activité (mensuel)" || exit 0
          git push
